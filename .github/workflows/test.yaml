name: Dev Pipeline

on:
  workflow_dispatch:
  push:
    branches: [ dev ]

env:
  IMAGE_REPO: 'thebluedrara'
  IMAGE_NAME: 'test_faithbound-legion'
  IMAGE_TAG: 'v0.0.2'
  DOCKER_IMAGE: "$IMAGE_REPO/$IMAGE_NAME:$IMAGE_TAG"
  DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USER }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
  VM_USER: "vagrant"
  VM_IP: "192.168.56.11"

jobs:
  Runner_setup:
    runs-on: ubuntu-latest
    steps:
      - name: Clone Project Repository
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pylint
        run: |
          "python -m pip install --upgrade pip"
          "pip install pylint"

      - name: Pylint Test
        run: echo "To Do, Add Lint Here"

      - name: Build Image
        run: "docker build -t $DOCKER_IMAGE -f docker/Dockerfile ."

      - name: Login to Dockerhub
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Image to Dockerhub
        run: docker push $DOCKER_IMAGE

      - name: Deploy Test Helm Chart Env
        run: |
          ssh -o StrictHostKeyChecking=no $VM_USER@$VM_IP
          




























      # 1️⃣ Checkout code
      - name: Checkout
        uses: actions/checkout@v4

      # 2️⃣ Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3️⃣ Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4️⃣ Build and Push Docker image
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/myapp:${{ github.sha }}

      # 5️⃣ SSH into VM and run Helm install
      - name: Deploy via SSH and Helm
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            helm upgrade --install myapp ./helm/chart \
              --set image.repository=${{ secrets.DOCKERHUB_USERNAME }}/myapp \
              --set image.tag=${{ github.sha }} \
              --namespace test --create-namespace

      # 6️⃣ Run tests (still on the VM)
      - name: Run tests on VM
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            # Example: curl health endpoint or run integration tests
            kubectl get pods -n test
            curl -f http://localhost:8080/health || exit 1

      # 7️⃣ Uninstall Helm release
      - name: Cleanup: uninstall Helm release
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            helm uninstall myapp -n test || true

      # 8️⃣ Delete Docker image from Docker Hub
      - name: Delete image from Docker Hub
        run: |
          TOKEN=$(curl -s -H "Content-Type: application/json" \
            -X POST -d '{"username": "${{ secrets.DOCKERHUB_USERNAME }}", "password": "${{ secrets.DOCKERHUB_TOKEN }}"}' \
            https://hub.docker.com/v2/users/login/ | jq -r .token)

          curl -s -X DELETE \
            -H "Authorization: Bearer $TOKEN" \
            https://hub.docker.com/v2/repositories/${{ secrets.DOCKERHUB_USERNAME }}/myapp/tags/${{ github.sha }}/
