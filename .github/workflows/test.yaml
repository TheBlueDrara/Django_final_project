name: Dev Pipeline

on:
  workflow_dispatch:
  push:
    branches: [ dev ]

env:
  IMAGE_REPO: 'thebluedrara'
  IMAGE_NAME: 'test_faithbound-legion'
  IMAGE_TAG: 'v0.0.2'
  DOCKER_IMAGE: "$IMAGE_REPO/$IMAGE_NAME:$IMAGE_TAG"
  DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USER }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
  VM_USER: "vagrant"
  VM_IP: "192.168.56.11"

jobs:
  Runner_setup:
    runs-on: ubuntu-latest
    steps:
      - name: Clone Project Repository
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pylint
        run: |
          "python -m pip install --upgrade pip"
          "pip install pylint"

      - name: Pylint Test
        run: echo "To Do, Add Lint Here"

      - name: Build Image
        run: "docker build -t $DOCKER_IMAGE -f docker/Dockerfile ."

      - name: Login to Dockerhub
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Image to Dockerhub
        run: docker push $DOCKER_IMAGE

      - name: Deploy Test Helm Chart Env
        run: |
          ssh -o StrictHostKeyChecking=no $VM_USER@$VM_IP \
          "helm install test-myapp /home/vagrant/Django_final_project/kubernetes/testing_helm_chart" \
           --wait --timeout 3m --atomic

      - name: Test WebApp
        run: |
          ssh -o StrictHostKeyChecking=no $VM_USER@$VM_IP \
          "curl -v localhost:30080" 
          echo "To Do, Fix test, 404 shows exit status code 0 also, blyat"

      - name: Cleanup
        if: always()
        run: | 
          ssh -o StrictHostKeyChecking=no $VM_USER@$VM_IP \
          "helm uninstall test-myapp || true"

